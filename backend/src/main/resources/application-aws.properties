# AWS profile: platform rules shared by demo and prod.
# Environment-specific values (URLs, credentials) come from environment variables or SSM.

# One JSON object per line, which CloudWatch Logs Insights parses into fields without extra setup
logging.structured.format.console=ecs

# The session cookie only travels over HTTPS. Set explicitly because CloudFront reaches the instance
# over HTTP, so the app cannot tell from the request (see SessionConfig)
itacatl.session.cookie.secure=true
