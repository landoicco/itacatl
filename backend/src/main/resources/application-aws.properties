# AWS profile: production on EC2, next to RDS (docs/infra-plan.md).
# The instance's user data passes DB_HOST, DB_NAME and DB_MASTER_SECRET_ARN; nothing here is a
# secret. Credentials come from the instance's IAM role.

# One JSON object per line, which CloudWatch Logs Insights parses into fields without extra setup
logging.structured.format.console=ecs

# The session cookie only travels over HTTPS. Set explicitly because CloudFront reaches the instance
# over HTTP, so the app cannot tell from the request (see SessionConfig)
itacatl.session.cookie.secure=true

# RDS's certificate authorities, added to the image by the Dockerfile. verify-full checks that the
# server's certificate is signed by them and names the host, not only that the link is encrypted
itacatl.database.tls=sslmode=verify-full&sslrootcert=/etc/ssl/rds/global-bundle.pem

# The master user's credentials, from the secret RDS manages. Read on every start, so RDS's
# rotation of the password every seven days is picked up by the next start; Flyway needs them only
# then. The secret holds "username" and "password"
spring.cloud.aws.secretsmanager.enabled=true
spring.config.import=aws-secretsmanager:${DB_MASTER_SECRET_ARN}?prefix=database.master.

# Flyway migrates as the master user, over a plain PostgreSQL connection
spring.flyway.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}?${itacatl.database.tls}
spring.flyway.user=${database.master.username}
spring.flyway.password=${database.master.password}

# The application connects as itacatl_app with no password: the AWS JDBC wrapper's iam plugin asks
# for a 15-minute token with the instance's role whenever the pool opens a connection. Open
# connections are not affected when the token expires
spring.datasource.url=jdbc:aws-wrapper:postgresql://${DB_HOST}:5432/${DB_NAME}?wrapperPlugins=iam&${itacatl.database.tls}
spring.datasource.driver-class-name=software.amazon.jdbc.Driver
spring.datasource.password=
itacatl.app-role.iam-authentication=true
