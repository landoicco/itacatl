# Local profile: docker compose on a developer machine.

# Containers have no TTY, so Spring would otherwise disable colored logs
spring.output.ansi.enabled=always

# The demo needs businesses and menus to show
itacatl.seed.enabled=true
# Password of the demo accounts the seed creates (ana@example.com, luis@example.com). A published
# demo credential, not a secret: the seed only runs locally and never in production
itacatl.seed.user-password=itacatl-demo
