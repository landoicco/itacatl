spring.application.name=itacatl

# PostgreSQL. The application connects as itacatl_app, which owns nothing and is subject to
# Row-Level Security; Flyway migrates as the tables' owner (docs/tenant-isolation.md)
spring.datasource.url=${DB_URL}
spring.datasource.username=itacatl_app
spring.datasource.password=${DB_APP_PASSWORD}
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}

# Flyway owns the schema
spring.jpa.hibernate.ddl-auto=none

# No Hibernate session for the whole request (Open Session in View): a session opens with each
# transaction, after the request's tenant is known, and lazy loading outside a service fails
# loudly instead of querying from the view (docs/tenant-isolation.md)
spring.jpa.open-in-view=false

# Which business each Hibernate session belongs to (@TenantId on tenant-owned entities)
spring.jpa.properties.hibernate.tenant_identifier_resolver=dev.licaza.itacatl.tenant.TenantIdentifierResolver

# Signed-in sessions, stored in PostgreSQL by Spring Session (docs/security.md). They end after
# 12 hours without requests: a working day on the owner's phone without signing in again
spring.session.timeout=12h

# Sample marketplace data, loaded at startup into an empty database. Off by default so production
# never gets it by accident. The file is a deployment setting, like the UI's default locale: a
# Mexican deployment sets ITACATL_SEED_FILE=classpath:seed/ice-cream-shops.es-MX.json
itacatl.seed.enabled=false
itacatl.seed.file=classpath:seed/ice-cream-shops.en.json
