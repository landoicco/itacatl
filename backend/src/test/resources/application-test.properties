# The datasource comes from the Testcontainers PostgreSQL container
# (see TestcontainersConfiguration). Flyway stays enabled and Hibernate only
# validates, so every test run also checks the migrations against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Password of itacatl_app, which AppRoleCallback creates in each test container. A test-only value:
# the container lives for one test run
DB_APP_PASSWORD=itacatl-app-test
