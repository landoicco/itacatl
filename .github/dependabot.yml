version: 2

# One weekly PR per ecosystem instead of one per package: minor and patch updates are
# grouped, and so are security fixes. Major updates still come one per PR, because they
# can break things and deserve their own review.
updates:
  # Keeps the SHA-pinned actions in the workflows up to date
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Types must match the Node version we run (see Runtime versions in the infra plan)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
      maven-security:
        applies-to: security-updates
        patterns: ["*"]

  # Base images of both Dockerfiles
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # A major image tag means a new Java or Node version, which is upgraded by hand
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Its tag embeds the JDK (3.9-eclipse-temurin-21-alpine), which Dependabot reads
      # as part of a minor update and would silently move the build to another Java
      - dependency-name: maven
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
