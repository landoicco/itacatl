name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main so its status is always known, not only inferred from the PR
  push:
    branches: [main]

# Least privilege: CI only needs to read the code
permissions:
  contents: read

# A new push to the same PR cancels the run that is now outdated
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA because tags can be moved; Dependabot keeps them updated
jobs:
  backend:
    # Job names are the required status checks in the main ruleset: renaming one breaks the rule
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Spotless check, compilation and tests; Testcontainers uses the runner's Docker
      - run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  images:
    # Catches Dockerfile problems that the build tools alone do not see
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build backend
      - run: docker build frontend
