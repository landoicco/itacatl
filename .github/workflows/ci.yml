name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main so its status is always known, not only inferred from the PR
  push:
    branches: [main]

# Least privilege: CI only needs to read the code
permissions:
  contents: read

# A new push to the same PR cancels the run that is now outdated
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA because tags can be moved; Dependabot keeps them updated
jobs:
  backend:
    # Job names are the required status checks in the main ruleset: renaming one breaks the rule
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Spotless check, compilation and tests; Testcontainers uses the runner's Docker
      - run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  terraform:
    # Terraform and TFLint come from the flake's infra shell, so CI runs the exact versions of
    # the dev shell. No AWS credentials: every check runs offline, tests against a mocked provider
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs Nix only; packages come from the public cache.nixos.org
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix develop .#infra -c terraform -chdir=infra fmt -check -recursive
      - run: nix develop .#infra -c tflint --chdir=infra --recursive
      # One block per stack
      - name: bootstrap
        run: |
          nix develop .#infra -c terraform -chdir=infra/bootstrap init -backend=false -input=false
          nix develop .#infra -c terraform -chdir=infra/bootstrap validate
          nix develop .#infra -c terraform -chdir=infra/bootstrap test

  images:
    # Catches Dockerfile problems that the build tools alone do not see
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build backend
      - run: docker build frontend
