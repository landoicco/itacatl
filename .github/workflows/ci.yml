name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main so its status is always known, not only inferred from the PR
  push:
    branches: [main]

# Least privilege: CI only needs to read the code
permissions:
  contents: read

# A new push to the same PR cancels the run that is now outdated
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA because tags can be moved; Dependabot keeps them updated
jobs:
  backend:
    # Job names are the required status checks in the main ruleset: renaming one breaks the rule
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
        # Every step runs inside the flake's backend shell: the JDK and Maven of the dev shell
        shell: nix develop ..#backend -c bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs Nix only; packages come from the public cache.nixos.org
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # Nix brings the tools, not the dependencies they download. No restore-keys: a new pom.xml
      # starts a fresh cache, so versions it no longer uses don't pile up
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}
      # Spotless check, compilation and tests; Testcontainers uses the runner's Docker
      - run: mvn -B verify

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
        shell: nix develop ..#frontend -c bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      # npm's download cache, not node_modules: npm ci deletes node_modules anyway
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  terraform:
    # Terraform, TFLint and terraform-docs come from the flake's infra shell, so CI runs the exact
    # versions of the dev shell. No AWS credentials: every check runs offline, tests against a
    # mocked provider. The shell's plugin cache downloads the AWS provider once for every directory
    name: Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: nix develop .#infra -c bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: terraform -chdir=infra fmt -check -recursive
      - run: tflint --chdir=infra --recursive
      # Fails when a module's README tables no longer match its variables and outputs
      - run: terraform-docs --output-check infra
      # Misconfigurations, of every severity. Accepted findings are ignored inline, with a reason.
      # The flake pins Trivy's version, so its check for a newer one is only noise
      - run: trivy config --exit-code 1 --skip-version-check infra
      # One block per stack and per module
      - name: bootstrap
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          terraform -chdir=infra/bootstrap validate
          terraform -chdir=infra/bootstrap test
      - name: modules/network
        run: |
          terraform -chdir=infra/modules/network init -backend=false -input=false
          terraform -chdir=infra/modules/network validate
          terraform -chdir=infra/modules/network test
      - name: modules/database
        run: |
          terraform -chdir=infra/modules/database init -backend=false -input=false
          terraform -chdir=infra/modules/database validate
          terraform -chdir=infra/modules/database test
      - name: modules/backend
        run: |
          terraform -chdir=infra/modules/backend init -backend=false -input=false
          terraform -chdir=infra/modules/backend validate
          terraform -chdir=infra/modules/backend test
      - name: envs/prod
        run: |
          terraform -chdir=infra/envs/prod init -backend=false -input=false
          terraform -chdir=infra/envs/prod validate
          terraform -chdir=infra/envs/prod test

  images:
    # Catches Dockerfile problems that the build tools alone do not see
    name: Docker images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build backend
      - run: docker build frontend
