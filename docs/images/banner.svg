<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">itacatl: dynamic menus for small food businesses</title>
  <desc id="desc">Three businesses of different kinds, an ice cream shop, a family eatery and a bakery, each publishing today's menu with limited stock in its own visual theme.</desc>
  <defs>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7A2E8F" flood-opacity="0.12"/>
    </filter>
    <filter id="warm" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8A4B12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .brand { font-size: 96px; font-weight: 800; letter-spacing: -3px; fill: #2A1636; }
    .headline { font-size: 38px; font-weight: 700; letter-spacing: -0.8px; fill: #2A1636; }
    .lead { font-size: 20px; fill: #5E4A66; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #7A2E8F; }
    .step { font-size: 16px; font-weight: 700; fill: #2A1636; }
    .tech { font-size: 15px; fill: #5E4A66; }
    .chip { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; }
    .name { font-size: 24px; font-weight: 800; letter-spacing: -0.4px; }
    .pill { font-size: 12px; font-weight: 700; }
    .item { font-size: 16px; font-weight: 600; }
    .price { font-size: 16px; font-weight: 800; }
    .stock { font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="#FFF8F3"/>
  <circle cx="1180" cy="40" r="210" fill="#F6E4F1"/>
  <circle cx="660" cy="660" r="170" fill="#FDEBD3"/>

  <!-- Brand and pitch -->
  <text x="72" y="140" class="eyebrow">OPEN-SOURCE FOOD MARKETPLACE</text>
  <text x="68" y="232" class="brand">itacatl</text>
  <text x="72" y="300" class="headline">Dynamic menus for</text>
  <text x="72" y="346" class="headline">small food businesses</text>
  <text x="72" y="398" class="lead">Businesses publish what they sell today,</text>
  <text x="72" y="426" class="lead">with limited stock. Customers reserve</text>
  <text x="72" y="454" class="lead">before it sells out, then pick it up.</text>

  <!-- Core flow -->
  <g transform="translate(72 486)">
    <rect width="78" height="40" rx="20" fill="#FFFFFF" stroke="#E6D3E3"/>
    <text x="39" y="26" class="step" text-anchor="middle">Find</text>
    <text x="96" y="27" class="step" fill="#7A2E8F">→</text>
    <rect x="120" width="104" height="40" rx="20" fill="#FFFFFF" stroke="#E6D3E3"/>
    <text x="172" y="26" class="step" text-anchor="middle">Reserve</text>
    <text x="242" y="27" class="step" fill="#7A2E8F">→</text>
    <rect x="266" width="70" height="40" rx="20" fill="#FFFFFF" stroke="#E6D3E3"/>
    <text x="301" y="26" class="step" text-anchor="middle">Pay</text>
    <text x="354" y="27" class="step" fill="#7A2E8F">→</text>
    <rect x="378" width="104" height="40" rx="20" fill="#7A2E8F"/>
    <text x="430" y="26" class="step" text-anchor="middle" fill="#FFFFFF">Pick up</text>
  </g>

  <text x="72" y="590" class="tech">Java 21 · Spring Boot 4 · React 19 · PostgreSQL · AWS with Terraform</text>

  <!-- Vertical 1: ice cream shop, pastel theme -->
  <g transform="translate(690 72)">
    <rect width="520" height="152" rx="26" fill="#FFFFFF" filter="url(#soft)"/>
    <rect x="24" y="20" width="132" height="22" rx="11" fill="#F3E3F0"/>
    <text x="90" y="35" class="chip" text-anchor="middle" fill="#7A2E8F">ICE CREAM SHOP</text>
    <rect x="336" y="18" width="160" height="26" rx="13" fill="#D6F5E3"/>
    <text x="416" y="36" class="pill" text-anchor="middle" fill="#1D5E3A">Open until 9:00 PM</text>
    <text x="24" y="78" class="name" fill="#3B1747">Sunny Scoops</text>
    <circle cx="36" cy="105" r="10" fill="#F6D365"/>
    <text x="56" y="111" class="item" fill="#3B1747">Passion fruit sorbet</text>
    <text x="400" y="111" class="price" text-anchor="end" fill="#3B1747">$45</text>
    <text x="496" y="111" class="stock" text-anchor="end" fill="#A3122B" font-weight="700">Only 3 left</text>
    <circle cx="36" cy="132" r="10" fill="#C8E6A0"/>
    <text x="56" y="138" class="item" fill="#3B1747">Lime sorbet</text>
    <text x="400" y="138" class="price" text-anchor="end" fill="#3B1747">$40</text>
    <text x="496" y="138" class="stock" text-anchor="end" fill="#6B4A75">40 left</text>
  </g>

  <!-- Vertical 2: family eatery (fonda), market theme -->
  <g transform="translate(690 246)">
    <rect x="6" y="6" width="520" height="152" rx="14" fill="#23160F"/>
    <rect width="520" height="152" rx="14" fill="#FFFFFF" stroke="#23160F" stroke-width="2.5"/>
    <rect x="24" y="20" width="132" height="22" rx="6" fill="#FFE3A3" stroke="#23160F" stroke-width="1.5"/>
    <text x="90" y="35" class="chip" text-anchor="middle" fill="#23160F">FAMILY EATERY</text>
    <rect x="316" y="18" width="180" height="26" rx="13" fill="#00796B"/>
    <text x="406" y="36" class="pill" text-anchor="middle" fill="#FFFFFF">Lunch 1:00 – 5:00 PM</text>
    <text x="24" y="78" class="name" fill="#C2185B">Fonda Doña Mary</text>
    <rect x="26" y="95" width="20" height="20" rx="4" fill="#C2185B"/>
    <text x="56" y="111" class="item" fill="#23160F">Set lunch: chiles rellenos</text>
    <text x="400" y="111" class="price" text-anchor="end" fill="#23160F">$85</text>
    <text x="496" y="111" class="stock" text-anchor="end" fill="#5B4A3F">12 left</text>
    <rect x="26" y="122" width="20" height="20" rx="4" fill="#F4A300"/>
    <text x="56" y="138" class="item" fill="#23160F">Set lunch: mole poblano</text>
    <text x="400" y="138" class="price" text-anchor="end" fill="#23160F">$90</text>
    <text x="496" y="138" class="stock" text-anchor="end" fill="#B3261E" font-weight="700">Sold out</text>
  </g>

  <!-- Vertical 3: bakery, warm theme -->
  <g transform="translate(690 426)">
    <rect width="520" height="152" rx="18" fill="#FFFDF8" stroke="#EAD7C0" stroke-width="1.5" filter="url(#warm)"/>
    <rect x="24" y="20" width="96" height="22" rx="11" fill="#F6E7D4"/>
    <text x="72" y="35" class="chip" text-anchor="middle" fill="#8A4B12">BAKERY</text>
    <rect x="290" y="18" width="206" height="26" rx="13" fill="#FFE9C7"/>
    <text x="393" y="36" class="pill" text-anchor="middle" fill="#6A3E00">Opens tomorrow at 7:00 AM</text>
    <text x="24" y="78" class="name" fill="#5A2E0C">La Espiga Bakery</text>
    <circle cx="36" cy="105" r="10" fill="#E8B27A"/>
    <text x="56" y="111" class="item" fill="#5A2E0C">Conchas</text>
    <text x="400" y="111" class="price" text-anchor="end" fill="#5A2E0C">$15</text>
    <text x="496" y="111" class="stock" text-anchor="end" fill="#7A5A44">40 left</text>
    <circle cx="36" cy="132" r="10" fill="#C98E5A"/>
    <text x="56" y="138" class="item" fill="#5A2E0C">Pan de muerto</text>
    <text x="400" y="138" class="price" text-anchor="end" fill="#5A2E0C">$45</text>
    <text x="496" y="138" class="stock" text-anchor="end" fill="#A3122B" font-weight="700">Only 2 left</text>
  </g>
</svg>
