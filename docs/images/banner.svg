<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">itacatl: dynamic menus for small food businesses</title>
  <desc id="desc">Three businesses of different kinds, an ice cream shop, a family eatery and a bakery, each publishing today's menu with limited stock in its own visual theme.</desc>
  <defs>
    <filter id="soft" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7A2E8F" flood-opacity="0.12"/>
    </filter>
    <filter id="warm" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8A4B12" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .brand { font-size: 96px; font-weight: 800; letter-spacing: -3px; fill: #2A1636; }
    .headline { font-size: 38px; font-weight: 700; letter-spacing: -0.8px; fill: #2A1636; }
    .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #7A2E8F; }
    .chip { font-size: 11px; font-weight: 800; letter-spacing: 1.6px; }
    .name { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
    .pill { font-size: 12px; font-weight: 700; }
    .item { font-size: 16px; font-weight: 600; }
    .price { font-size: 16px; font-weight: 800; }
    .stock { font-size: 13px; }
  </style>

  <!-- Background -->
  <rect width="1280" height="400" fill="#FFF8F3"/>
  <circle cx="1190" cy="10" r="180" fill="#F6E4F1"/>
  <circle cx="610" cy="430" r="130" fill="#FDEBD3"/>

  <!-- Brand and pitch -->
  <text x="72" y="118" class="eyebrow">OPEN-SOURCE FOOD MARKETPLACE</text>
  <text x="68" y="212" class="brand">itacatl</text>
  <text x="72" y="278" class="headline">Dynamic menus for</text>
  <text x="72" y="324" class="headline">small food businesses</text>

  <!-- Vertical 1: ice cream shop, pastel theme -->
  <g transform="translate(690 28)">
    <rect width="520" height="104" rx="24" fill="#FFFFFF" filter="url(#soft)"/>
    <rect x="24" y="16" width="132" height="20" rx="10" fill="#F3E3F0"/>
    <text x="90" y="30" class="chip" text-anchor="middle" fill="#7A2E8F">ICE CREAM SHOP</text>
    <rect x="336" y="14" width="160" height="24" rx="12" fill="#D6F5E3"/>
    <text x="416" y="31" class="pill" text-anchor="middle" fill="#1D5E3A">Open until 9:00 PM</text>
    <text x="24" y="62" class="name" fill="#3B1747">Sunny Scoops</text>
    <circle cx="34" cy="84" r="9" fill="#F6D365"/>
    <text x="52" y="90" class="item" fill="#3B1747">Passion fruit sorbet</text>
    <text x="400" y="90" class="price" text-anchor="end" fill="#3B1747">$45</text>
    <text x="496" y="90" class="stock" text-anchor="end" fill="#A3122B" font-weight="700">Only 3 left</text>
  </g>

  <!-- Vertical 2: family eatery (fonda), market theme -->
  <g transform="translate(690 148)">
    <rect x="6" y="6" width="520" height="104" rx="14" fill="#23160F"/>
    <rect width="520" height="104" rx="14" fill="#FFFFFF" stroke="#23160F" stroke-width="2.5"/>
    <rect x="24" y="16" width="132" height="20" rx="6" fill="#FFE3A3" stroke="#23160F" stroke-width="1.5"/>
    <text x="90" y="30" class="chip" text-anchor="middle" fill="#23160F">FAMILY EATERY</text>
    <rect x="316" y="14" width="180" height="24" rx="12" fill="#00796B"/>
    <text x="406" y="31" class="pill" text-anchor="middle" fill="#FFFFFF">Lunch 1:00 – 5:00 PM</text>
    <text x="24" y="62" class="name" fill="#C2185B">Fonda Doña Mary</text>
    <rect x="25" y="75" width="18" height="18" rx="4" fill="#F4A300"/>
    <text x="52" y="90" class="item" fill="#23160F">Set lunch: mole poblano</text>
    <text x="400" y="90" class="price" text-anchor="end" fill="#23160F">$90</text>
    <text x="496" y="90" class="stock" text-anchor="end" fill="#B3261E" font-weight="700">Sold out</text>
  </g>

  <!-- Vertical 3: bakery, warm theme -->
  <g transform="translate(690 268)">
    <rect width="520" height="104" rx="18" fill="#FFFDF8" stroke="#EAD7C0" stroke-width="1.5" filter="url(#warm)"/>
    <rect x="24" y="16" width="96" height="20" rx="10" fill="#F6E7D4"/>
    <text x="72" y="30" class="chip" text-anchor="middle" fill="#8A4B12">BAKERY</text>
    <rect x="290" y="14" width="206" height="24" rx="12" fill="#FFE9C7"/>
    <text x="393" y="31" class="pill" text-anchor="middle" fill="#6A3E00">Opens tomorrow at 7:00 AM</text>
    <text x="24" y="62" class="name" fill="#5A2E0C">La Espiga Bakery</text>
    <circle cx="34" cy="84" r="9" fill="#E8B27A"/>
    <text x="52" y="90" class="item" fill="#5A2E0C">Conchas</text>
    <text x="400" y="90" class="price" text-anchor="end" fill="#5A2E0C">$15</text>
    <text x="496" y="90" class="stock" text-anchor="end" fill="#7A5A44">40 left</text>
  </g>
</svg>
